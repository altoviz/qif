name: Action to build and publish the project as a nuget package to github package registry

on:
  workflow_call:
    inputs:
      source-path:
        required: true
        description: "Path to the source folder. Example : src"
        default: "src"
        type: string
      project-path:
        required: true
        description: "Path to the project folder. Example : Altoviz.Ofx"
        type: string
      project-file:
        description: "Path to the project file. Example : Altoviz.Ofx/Altoviz.Ofx.csproj"
        required: true
        type: string
    secrets:
      gh-pat:
        description: "GitHub Personal Access Token"
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.source-path }}
    outputs: 
      version: ${{ steps.build-gitversion.outputs.SemVer }}
      assembly-version: ${{ steps.build-gitversion.outputs.AssemblySemVer }}
      assembly-file-version: ${{ steps.build-gitversion.outputs.AssemblySemFileVer }}
      commits-since-version-source: ${{ steps.build-gitversion.outputs.CommitsSinceVersionSource }} 
    env:
      BUILD_CONFIGURATION: Release
    steps:
    - name: Prerequisites
      working-directory: .
      run: |
        mkdir ./${{ inputs.source-path }}
        mkdir ./artifacts
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        # fetch-depth is required for GitVersion
        fetch-depth: 0
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v4
      with:
        versionSpec: '6.x'
        preferLatestVersion: true
    - name: Determine Version
      uses: gittools/actions/gitversion/execute@v4
      id: build-gitversion
      with:
        configFilePath: GitVersion.yaml
        updateProjectFiles: 'true'
    - name: Display GitVersion outputs
      run: |
        echo "Version: ${{ steps.build-gitversion.outputs.SemVer }}"
        echo "Version: ${{ steps.build-gitversion.outputs.AssemblySemVer }}"
        echo "Version: ${{ steps.build-gitversion.outputs.AssemblySemFileVer }}"
        echo "CommitsSinceVersionSource: ${{ steps.build-gitversion.outputs.CommitsSinceVersionSource }}"
    #Build/pack the project
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 9.x
    - name: Display .NET version
      run: dotnet --version
    - name: Install .NET tools
      run: |
        dotnet new tool-manifest --force
        dotnet tool install DotnetCtrfJsonReporter --local
    - name: Restore .NET dependencies
      run: dotnet restore ${{ inputs.project-file }}
    - name: Build .NET project
      id: build-build
      run: dotnet build --no-restore --nologo /p:Version=${{ steps.build-gitversion.outputs.AssemblySemVer }} /p:AssemblyVersion=${{steps.build-gitversion.outputs.AssemblySemVer }} /p:NuGetVersion=${{steps.build-gitversion.outputs.AssemblySemVer }} --configuration ${{ env.BUILD_CONFIGURATION }} ${{ inputs.project-file }}
    - name: Run .NET tests
      id: build-tests
      if: steps.build-build.outcome == 'success'
      # run: dotnet test --no-build --nologo --verbosity detailed --logger "trx;LogFileName=TestResults.trx" --results-directory ./TestResults --configuration ${{ env.BUILD_CONFIGURATION }}
      run: dotnet test --verbosity normal --logger "trx;LogFileName=TestResults.trx" --results-directory TestResults --configuration ${{ env.BUILD_CONFIGURATION }}
    - name: Convert .NET test results to JSON
      if: steps.build-tests.outcome == 'success'
      run: |
        dotnet tool run dotnet-ctrf-json-reporter convert --input ${{ inputs.source-path }}/TestResults/*.trx
    # - name: Create .NET tests report
    #   id: release-tests-report
    #   uses: dorny/test-reporter@v2
    #   if: steps.build-tests.outcome == 'success'
    #   with:
    #     name: .NET tests report
    #     # We're not in the same working directory as the tests results, so we need to specify the path
    #     path: ${{ inputs.source-path }}/TestResults/*.trx
    #     reporter: dotnet-trx
    #     fail-on-empty: "false"
    #     token: ${{ secrets.gh-pat }}
    # - name: .NET tests report
    #   uses: EnricoMi/publish-unit-test-result-action@v2
    #   if: (!cancelled())
    #   with:
    #     files: ${{ inputs.source-path }}/TestResults/*.trx
    #     report_individual_runs: true
    #     report_suite_logs: 'any'
    #     json_suite_details: true
    #     json_test_case_results: true
    #     action_fail: true
    #     action_fail_on_inconclusive: true
    - name: Publish tests report
      uses: ctrf-io/github-test-reporter@v1
      with:
        report-path: TestResults/*.json
        summary-report: true
        summary-delta-report: true
        tests-changed-report: true
        github-report: true
        test-report: true
        test-list-report: true
        failed-report: true
        fail-rate-report: true
        flaky-report: true
        flaky-rate-report: true
        failed-folded-report: true
        previous-results-report: true
        insights-report: true
        slowest-report: true
        ai-report: true
        ai-summary-report: true
        skipped-report: true
        suite-folded-report: true
        suite-list-report: true
        file-report: true
        pull-request-report: true
        commit-report: true
        community-report: true
        upload-artifact: true
        exit-on-no-files: true
        exit-on-fail: true
        exit-on-empty: true
        collapse-large-reports: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      if: always()
    - name: Build and Pack NuGet package
      id: build-pack
      if: steps.build-tests.outcome == 'success'
      run: dotnet pack --no-build --nologo -p:Version='${{ steps.build-gitversion.outputs.AssemblySemVer }}' --configuration ${{ env.BUILD_CONFIGURATION }} ${{ inputs.project-file }}
    - name: Upload NuGet package artifacts
      id: build-upload
      uses: actions/upload-artifact@v5
      if: steps.build-pack.outcome == 'success'
      with:
        name: nugetPackage
        path: ${{ inputs.source-path }}/${{ inputs.project-path }}/bin/Release/*.nupkg
  release:
    runs-on: ubuntu-latest
    needs: [build]
    # Only run if the workflow was triggered by a tag
    # if: github.ref_type == 'tag' && needs.build.outputs.commits-since-version-source > 0
    if: github.ref_type == 'tag'
    steps:
    - name: Download Nuget package artifacts
      uses: actions/download-artifact@v6
      with:
        name: nugetPackage
        path: artifacts/
    - name: Prep packages
      run: dotnet nuget add source --username danvy --password ${{ secrets.gh-pat }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/altoviz/index.json"
    - name: Push package to GitHub packages
      id: release-push
      # Only release if there has been a commit/version change
      run: dotnet nuget push artifacts/*.nupkg --api-key ${{ secrets.gh-pat }} --source "github"
    - name: Create Release
      uses: ncipollo/release-action@v1
      if: steps.release-push.outcome == 'success'
      with:
        tag: ${{ needs.build.outputs.version }}
        name: Release ${{ needs.build.outputs.version }}
        artifacts: "artifacts/*.nupkg"
        token: ${{ secrets.gh-pat }}