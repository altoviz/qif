name: Build and publish

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      force_build:
        description: "Forces a new build"
        required: true
        default: "false"
      force_release:
        description: "Forces a new release"
        required: true
        default: "false"
concurrency:
  group: pipeline-${{ github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
  issues: read
  checks: write
  pull-requests: write
jobs:
  call-build:
    uses: ./.github/workflows/build.yaml
    with:
      source-path: "src"
      project-path: "Altoviz.Qif"
      project-file: "Altoviz.Qif/Altoviz.Qif.csproj"
    secrets:
      gh-pat: ${{ secrets.GH_PAT }}
